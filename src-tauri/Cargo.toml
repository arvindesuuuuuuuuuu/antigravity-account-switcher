[package]
name = "antigravity-account-switcher"
version = "1.0.0"
description = "Fast multi-account manager & rate-limit auto-switcher for Antigravity on Linux and Windows"
authors = ["Antigravity Account Switcher contributors"]
edition = "2021"

[lib]
name = "antigravity_account_switcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
base64 = "0.22"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
dirs = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sysinfo = "0.31"

[dev-dependencies]
tempfile = "3"
